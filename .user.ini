; Wird von PHP-FPM/CGI gelesen (übliches Shared-Hosting). Unter mod_php wirkungslos.
; Fehler protokollieren statt ausgeben, damit API-Antworten gültiges JSON bleiben.
display_errors = Off
log_errors = On
; Bild-Uploads bis 10 MB erlauben (falls der Hoster das Überschreiben zulässt)
upload_max_filesize = 10M
post_max_size = 12M
